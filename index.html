<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>트릭 오어 트릿 at 가장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#0E2418;--night2:#163A27;--green:#2E8D50;--amber:#FAA61A;--pumpkin:#F07A1A;
  --cream:#F7F1E3;--ink:#F7F1E3;--muted:#B9C8B8;--char:#1C1A22;--line:rgba(247,241,227,.16);
  --disp:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#0E2418;--ink:#F7F1E3}}
:root[data-theme="dark"]{--night:#0E2418;--ink:#F7F1E3}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--body);word-break:keep-all;
  background:radial-gradient(ellipse 85% 45% at 50% 110%,rgba(240,122,26,.32),transparent 70%),
             radial-gradient(ellipse 60% 40% at 50% -10%,rgba(46,141,80,.35),transparent 70%),var(--night);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* 떠다니는 유령 */
.ghosts{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ghost{position:absolute;width:clamp(54px,7vw,84px);border:0;background:none;padding:0;pointer-events:auto;
  animation:drift var(--d,7s) ease-in-out infinite;opacity:.85;transition:opacity .4s,scale .4s}
.ghost svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(247,241,227,.35))}
.ghost.boo{opacity:0;scale:1.6;transition:opacity .5s .4s,scale .5s}
.ghost .say{position:absolute;left:50%;top:-34px;translate:-50% 0;font-family:var(--disp);font-size:26px;color:var(--amber);opacity:0;white-space:nowrap}
.ghost.boo .say{opacity:1}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(var(--dx,14px),-22px) rotate(5deg)}}

.stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:clamp(14px,2.6vh,36px) clamp(16px,4vw,48px) clamp(16px,2.6vh,32px);gap:clamp(8px,1.6vh,20px);pointer-events:none}
.stage>*{pointer-events:auto}
.logo{background:var(--cream);border-radius:999px;padding:clamp(8px,1.1vh,13px) clamp(18px,2.4vw,28px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.logo img{height:clamp(32px,4.8vh,56px);width:auto;display:block}
.head{text-align:center}
.title{font-family:var(--disp);font-weight:400;margin:0;line-height:1;font-size:clamp(46px,min(10.5vw,9.5vh),120px);
  color:var(--pumpkin);text-shadow:0 4px 0 #7a3507,0 10px 34px rgba(240,122,26,.5)}
.guide{margin:clamp(10px,1.6vh,18px) auto 0;max-width:30em;color:var(--muted);font-size:clamp(16px,2.2vh,22px);line-height:1.55;min-height:3.1em}
.guide b{color:var(--cream)}
.guide.big{color:var(--cream);font-weight:900;font-size:clamp(22px,3.2vh,32px)}

.deck{flex:1;width:100%;display:flex;justify-content:center;align-items:center;gap:var(--gap);--gap:clamp(24px,6vw,80px);perspective:1500px;pointer-events:none}
.card{--w:min(32vw,36vh,300px);width:var(--w);aspect-ratio:5/7;border:0;padding:0;background:none;position:relative;pointer-events:auto}
.card:disabled{cursor:default}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.deck.pick .card .inner{animation:wiggle 1.4s ease-in-out infinite}
.deck.pick .card:nth-child(2) .inner{animation-delay:-.7s}
@keyframes wiggle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-10px)}}
.deck.pick .card:active .inner{scale:.96}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid var(--cream);box-shadow:0 16px 38px rgba(0,0,0,.5)}
.back{background:radial-gradient(circle at 50% 58%,rgba(250,166,26,.38),transparent 62%),var(--night2)}
.back::before{content:"";position:absolute;inset:9px;border:2px dashed rgba(247,241,227,.28);border-radius:13px}
.back svg{width:78%;height:auto;filter:drop-shadow(0 0 18px rgba(240,122,26,.55))}
.deck.pick .back svg{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 30px rgba(250,166,26,.95))}}
.front{transform:rotateY(180deg);text-align:center}
.front.treat{background:var(--cream);color:var(--green)}
.front.trick{background:var(--char);color:var(--amber)}
.front .em{font-size:calc(var(--w)*.28);line-height:1.1}
.front .k{font-family:var(--disp);font-size:calc(var(--w)*.22);line-height:1}
.front .s{font-weight:900;font-size:calc(var(--w)*.085);margin-top:.5em;opacity:.85}
.card.other{opacity:.45;filter:grayscale(.4);transition:opacity .4s,filter .4s}
.card.chosen{z-index:2}

.go{border:0;border-radius:999px;background:var(--pumpkin);color:#fff;font-family:var(--disp);font-size:clamp(26px,4.2vh,42px);
  padding:.45em 1.4em;box-shadow:0 7px 0 #7a3507,0 14px 34px rgba(240,122,26,.45);transition:translate .1s,box-shadow .1s}
.go:active{translate:0 5px;box-shadow:0 2px 0 #7a3507,0 8px 20px rgba(240,122,26,.4)}
.go[hidden]{display:none}
.foot{color:var(--muted);font-size:clamp(13px,1.7vh,16px);text-align:center;margin:0}

/* 결과 */
.result{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(8,20,13,.78);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.result.show{display:flex}
.hero{filter:drop-shadow(0 0 16px rgba(247,241,227,.3));position:relative;height:clamp(220px,42vh,450px);display:flex;align-items:flex-end;justify-content:center;margin-bottom:-14px;z-index:2}
.hero img{height:100%;width:auto;animation:popup .7s cubic-bezier(.2,1.5,.35,1) both;transform-origin:50% 100%}
.hero .ghostbig{height:70%;animation:popup .7s cubic-bezier(.2,1.5,.35,1) both}
@keyframes popup{0%{transform:translateY(55%) scale(.4);opacity:0}60%{opacity:1}100%{transform:none}}
.bubble{position:absolute;top:2%;left:calc(100% - 26px);font-family:var(--disp);font-size:clamp(34px,6vh,60px);line-height:1;
  padding:.28em .55em;border-radius:22px;white-space:nowrap;animation:bubble .5s .5s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bubble::after{content:"";position:absolute;left:14px;bottom:-14px;border:10px solid transparent;border-top:16px solid currentColor}
.bubble.treat{background:var(--cream);color:var(--green)}
.bubble.treat::after{border-top-color:var(--cream)}
.bubble.trick{background:var(--amber);color:var(--night)}
.bubble.trick::after{border-top-color:var(--amber)}
/* 트릭: 캐릭터가 어둠 속 뒤에서 앞으로 달려와 커짐 */
.hero .rushin{animation:rushin 1.2s cubic-bezier(.55,0,.8,.3) both}
@keyframes rushin{
  0%{transform:scale(.1) translateX(0);filter:brightness(.15) blur(3px);opacity:0}
  12%{opacity:1}
  30%{transform:scale(.22) translateX(-40px) rotate(-6deg);filter:brightness(.25) blur(2px)}
  55%{transform:scale(.42) translateX(40px) rotate(6deg);filter:brightness(.45) blur(1px)}
  78%{transform:scale(.75) translateX(-25px) rotate(-4deg);filter:brightness(.75)}
  92%{transform:scale(1.18) rotate(2deg);filter:brightness(1.1)}
  100%{transform:none;filter:none;opacity:1}}
.bubble.trick{animation-delay:1.2s}
.panel.trick{animation-delay:1.15s}
.result.shake{animation:shake .45s 1.12s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-10px,4px)}30%{transform:translate(9px,-5px)}45%{transform:translate(-7px,3px)}60%{transform:translate(6px,-2px)}80%{transform:translate(-3px,1px)}}
@media (prefers-reduced-motion:reduce){.hero .rushin,.result.shake{animation:none}}
@keyframes bubble{from{transform:scale(0) rotate(-12deg)}to{transform:none}}
.panel{position:relative;width:min(620px,100%);border-radius:28px;text-align:center;padding:clamp(20px,3.4vh,38px) clamp(20px,4vw,40px);
  animation:rise .5s .15s cubic-bezier(.2,1.2,.4,1) both;max-height:58vh;overflow:auto}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.panel.treat{background:var(--cream);color:var(--night)}
.panel.trick{background:var(--char);color:var(--cream);border:3px solid var(--amber)}
.r-big{font-family:var(--disp);font-size:clamp(32px,5.6vh,58px);line-height:1.2}
.panel.treat .r-big b{color:var(--pumpkin);font-weight:400;font-size:1.25em}
.panel.trick .r-big{color:var(--amber)}
.mission{font-weight:900;font-size:clamp(20px,3vh,30px);line-height:1.4;margin:.5em 0 0}
.r-sub{font-size:clamp(15px,2.1vh,20px);line-height:1.6;margin:.6em 0 0;font-weight:500;opacity:.8}
.staff{margin-top:clamp(16px,2.6vh,26px);padding-top:clamp(14px,2.2vh,20px);border-top:2px dashed rgba(127,127,127,.4);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.staff-label{width:100%;font-size:14px;opacity:.65}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:clamp(16px,2.2vh,20px);min-height:54px}
.btn.kid{background:transparent;border:2px solid currentColor}
.btn.kid[aria-pressed="true"]{background:var(--pumpkin);border-color:var(--pumpkin);color:#fff}
.btn.next{background:var(--green);color:#fff}
.panel.trick .btn.next{background:var(--cream);color:var(--night)}
.panel.trick .kidline{color:var(--cream);margin-bottom:.35em}
.draws{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:.7em}
.draws span{border-radius:999px;padding:5px 14px;font-weight:900;font-size:clamp(14px,2vh,18px)}
.draws .t{background:var(--green);color:#fff}.draws .k{background:var(--amber);color:var(--night)}
.snack b{color:var(--pumpkin);font-weight:400}
.panel.treat .snack{font-size:clamp(24px,4vh,40px);margin-top:.3em}
.btn.bonus{background:var(--pumpkin);color:#fff}
.result.combo .hero{height:clamp(170px,30vh,330px)}
.panel.combo{max-height:64vh}
.panel.combo .r-big{font-size:clamp(26px,4.3vh,44px)}
.panel.combo .mission{font-size:clamp(17px,2.5vh,25px);margin-top:.35em}
.btn.bonus:disabled{opacity:.5}
.panel.trick .kidline b{color:var(--pumpkin);font-weight:400;font-size:1.25em}
.kidline[hidden]{display:none}
.bump{display:inline-block;animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{from{transform:scale(1.6)}to{transform:none}}


/* 관리 */
.gear{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6;
  width:44px;height:44px;border-radius:50%;border:0;background:rgba(247,241,227,.06);color:rgba(247,241,227,.35);font-size:20px}
.gear.hold{background:rgba(250,166,26,.4);color:var(--cream)}
.admin{position:fixed;inset:0;z-index:30;display:none;background:var(--night);overflow:auto;-webkit-user-select:text;user-select:text;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
.admin.show{display:block}
.admin-in{max-width:620px;margin:0 auto}
.admin h2{font-family:var(--disp);font-weight:400;font-size:34px;color:var(--amber);margin:0 0 4px}
.hint{color:var(--muted);margin:0 0 22px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.stat{background:var(--night2);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:34px}
.stat span{color:var(--muted);font-size:14px}
.allstats{color:var(--muted);font-size:14px;margin:0 0 24px}
.field{margin:0 0 22px}
.field>label,.field>.lbl{display:block;font-weight:700;margin-bottom:8px}
.field input[type=number]{width:90px;font:inherit;font-size:18px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--night2);color:var(--cream)}
.field textarea{width:100%;min-height:150px;font:inherit;font-size:16px;line-height:1.6;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--night2);color:var(--cream)}
.field small{display:block;color:var(--muted);margin-top:6px;line-height:1.5}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chars label{background:var(--night2);border-radius:14px;padding:10px 6px;text-align:center;font-size:14px;border:2px solid transparent;cursor:pointer}
.chars label:has(input:checked){border-color:var(--amber)}
.chars img{height:90px;width:auto;display:block;margin:0 auto 6px}
.chars input{accent-color:var(--amber);width:20px;height:20px;vertical-align:middle}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--amber)}
.admin-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn.ghostbtn{background:transparent;border:2px solid var(--line);color:var(--muted)}
.btn.warn{background:transparent;border:2px solid #c0573b;color:#f2a58f}

.bit{position:fixed;top:-40px;z-index:25;pointer-events:none;animation:fall linear forwards}
.minig{position:fixed;z-index:26;pointer-events:none;left:0;top:0;will-change:transform}
.minig svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 10px rgba(247,241,227,.5));animation:hop .2s ease-in-out infinite alternate}
.minig.flip svg{scale:-1 1}
@keyframes hop{to{transform:translateY(-12px) rotate(7deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-aspect-ratio:3/4){.card{--w:min(38vw,32vh,300px)}}
@media (prefers-reduced-motion:reduce){
  .ghost,.deck.pick .card .inner,.deck.pick .back svg{animation:none}.inner{transition:none}
  .hero img,.hero .ghostbig,.bubble,.panel{animation:none}.bit{display:none}
}
</style>
</head>

      if(i%3!==2){const b=320+Math.random()*220;tone(b,t,.11,'sine',.28,b*(2.6+Math.random()*.8))}   // 뽅!

const deck=$('deck'),go=$('go'),guide=$('guide'),result=$('result'),panel=$('panel'),hero=$('hero');
let state='idle',cur=null;
function setGuide(html,big){guide.innerHTML=html;guide.classList.toggle('big',!!big)}
function setFoot(){$('foot').textContent='🍬 트릿: 오늘 고기 전체 '+S().disc+'% 할인   👻 트릭: 할로윈 과자 + 깜짝 미션   🎃 코스튬 입고 오면 한 번 더!'}
function build(){
  deck.className='deck';deck.innerHTML='';
  for(let i=0;i<2;i++){const c=document.createElement('button');c.className='card';c.disabled=true;c.setAttribute('aria-label','카드 '+(i+1));
    c.innerHTML='<div class="inner"><div class="face back">'+PUMPKIN+'</div><div class="face front"></div></div>';
    c.addEventListener('click',()=>choose(c));deck.appendChild(c)}
  state='idle';go.hidden=false;go.disabled=false;
  setGuide('고기를 <b>다 고르셨나요?</b> 외치고 버튼을 눌러 주세요.<br>카드를 뽑은 뒤에는 <b>상품을 바꿀 수 없어요.</b>');
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function shuffle(isBonus){
  if(state!=='idle')return;state='shuffle';keepAwake();audio();
  go.hidden=true;setGuide(isBonus===true?'🎃 코스튬 보너스! 섞는 중…':'섞는 중…',true);
  const [a,b]=deck.children;const d=a.getBoundingClientRect().width+parseFloat(getComputedStyle(deck).columnGap||0);
  const n=reduce?1:7;const mp3=playShuf();
  for(let i=0;i<n;i++){
    const [l,r]=deck.children;const dur=Math.max(150,270-i*20);if(!mp3)sfx.shuf();
    if(!reduce){
      const up=-(40+Math.random()*30),down=30+Math.random()*30;
      const p1=l.animate([{transform:'none'},{transform:`translate(${d/2}px,${up}px) rotate(8deg)`},{transform:`translate(${d}px,0)`}],{duration:dur,easing:'ease-in-out'});
      const p2=r.animate([{transform:'none'},{transform:`translate(${-d/2}px,${down}px) rotate(-8deg)`},{transform:`translate(${-d}px,0)`}],{duration:dur,easing:'ease-in-out'});
      await Promise.all([p1.finished,p2.finished]);
    }
    deck.insertBefore(r,l);
  }
  state='pick';deck.classList.add('pick');[...deck.children].forEach(c=>c.disabled=false);
  setGuide((cur&&cur.bonus?'🎃 보너스 카드! ':'')+'둘 중 하나를 골라 주세요!',true);
}
go.addEventListener('click',()=>shuffle());

function face(el,treat){el.className='face front '+(treat?'treat':'trick');
  el.innerHTML=treat?'<div class="em">🍬</div><div class="k">트릿!</div><div class="s">'+S().disc+'% 할인</div>'
                    :'<div class="em">👻</div><div class="k">트릭!</div><div class="s">과자 + 미션</div>'}
async function choose(card){
  if(state!=='pick')return;state='reveal';
  const treat=Math.random()*100<(S().pct??35);
  const tricks=S().tricks.filter(t=>t.trim());
  const on=S().chars.filter(k=>CHARS[k]);
  if(!cur||!cur.bonus)cur={draws:[],bonus:false};
  cur.draws.push({treat,mission:treat?'':pick(tricks.length?tricks:DEF.tricks),char:on.length?pick(on):null});
  bump(treat?'treat':'trick',1);
  deck.classList.remove('pick');[...deck.children].forEach(c=>c.disabled=true);
  const other=[...deck.children].find(c=>c!==card);
  face(card.querySelector('.front'),treat);face(other.querySelector('.front'),!treat);
  card.classList.add('chosen','flipped');sfx.flip();
  setGuide(treat?'트릿!':'트릭!',true);
  await sleep(reduce?100:900);
  other.classList.add('flipped','other');
  await sleep(reduce?100:800);
  showResult();
}
function showResult(){
  const s=S(),ds=cur.draws,d=ds[ds.length-1],t=d.treat,round=ds.length;
  const nT=ds.filter(x=>x.treat).length,nK=ds.length-nT,pct=nT*s.disc;
  const lastTrick=[...ds].reverse().find(x=>!x.treat);
  hero.innerHTML=(d.char?'<img class="'+(t?'':'rushin')+'" src="'+CHARS[d.char]+'" alt="">':'<div class="ghostbig '+(t?'':'rushin')+'">'+GHOST+'</div>')
    +'<div class="bubble '+(t?'treat':'trick')+'">'+(t?'트릿!':'트릭!')+'</div>';
  const combo=pct>0&&nK>0;panel.className='panel '+(t?'treat':'trick')+(combo?' combo':'');result.classList.toggle('combo',combo);
  let h='';
  if(round>1)h+='<div class="draws">'+ds.map((x,i)=>'<span class="'+(x.treat?'t':'k')+'">'+(i+1)+'번째 '+(x.treat?'트릿':'트릭')+'</span>').join('')+'</div>';
  if(pct>0)h+='<div class="r-big'+(t?'':' kidline')+'">오늘 고기 전체<br><b class="'+(round>1?'bump':'')+'">'+pct+'% 할인</b></div>';
  if(nK>0)h+='<div class="r-big snack">할로윈 과자 '+(nK>1?'<b>'+nK+'개</b> ':'')+'받아 가세요 🍬</div>';
  if(lastTrick)h+='<p class="mission">'+esc(lastTrick.mission)+'</p>';
  if(nK===0)h+='<p class="r-sub">축하합니다! 지금 바로 할인해 드릴게요!</p>';
  h+='<div class="staff"><div class="staff-label">직원 확인</div>'
   +(round===1?'<button class="btn bonus" id="bonusBtn">🎃 코스튬 보너스! 한 번 더 뽑기</button>':'')
   +'<button class="btn next" id="nextBtn">다음 손님</button></div>';
  panel.innerHTML=h;
  result.classList.remove('shake');result.classList.add('show');if(!t){void result.offsetWidth;result.classList.add('shake')}
  t?((playRes()||sfx.treat()),sfx.candy(.9),confetti()):sfx.trick();
  const bb=$('bonusBtn');if(bb)bb.addEventListener('click',bonus);
  $('nextBtn').addEventListener('click',next);
}
async function bonus(){ // 코스튬 손님: 유령들이 달려오고 카드 한 번 더
  if(!cur||cur.bonus)return;cur.bonus=true;bump('kid',1);
  $('bonusBtn').disabled=true;sfx.rush();ghostRush();
  await sleep(reduce?200:1500);
  result.classList.remove('show');build();
  go.hidden=true;setGuide('🎃 코스튬 보너스! 한 번 더 뽑아요',true);
  await sleep(reduce?100:700);shuffle(true);
}
function next(){result.classList.remove('show');cur=null;build()}

function noise(t0,dur,vol,freq){const a=audio();if(!a)return;try{const n=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=n.getChannelData(0);

function ghostRush(){ // 작은 유령들이 양쪽에서 달려와 폴짝 뛰고 사라짐
  if(reduce)return;const vw=innerWidth,vh=innerHeight;
  for(let i=0;i<10;i++){const left=i%2===0,s=44+Math.random()*30;
    const e=document.createElement('div');e.className='minig'+(left?'':' flip');e.style.width=s+'px';e.innerHTML=GHOST;document.body.appendChild(e);
    const y=vh*(.66+Math.random()*.24),x0=left?-s-20:vw+20,x1=vw/2+(left?-1:1)*(70+Math.random()*Math.min(340,vw*.32))-s/2;
    const a=e.animate([{transform:`translate(${x0}px,${y}px)`},{transform:`translate(${x1}px,${y}px)`,offset:.55},
      {transform:`translate(${x1}px,${y-40}px)`,offset:.7},{transform:`translate(${x1}px,${y}px)`,offset:.82},{transform:`translate(${x1}px,${y-20}px)`,opacity:0}],
      {duration:2300+Math.random()*500,delay:i*80,easing:'ease-out',fill:'both'});
    a.onfinish=()=>e.remove()}
}

/* 관리 (1.5초 길게 누르기) */
const gear=$('gear'),admin=$('admin');let hold=null;
const startHold=e=>{e.preventDefault();gear.classList.add('hold');hold=setTimeout(openAdmin,1500)};
const stopHold=()=>{gear.classList.remove('hold');clearTimeout(hold)};
gear.addEventListener('pointerdown',startHold);['pointerup','pointerleave','pointercancel'].forEach(t=>gear.addEventListener(t,stopHold));
gear.addEventListener('contextmenu',e=>e.preventDefault());
gear.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openAdmin()}});
$('fChars').innerHTML=CHAR_INFO.map(([k,n])=>'<label><img src="'+CHARS[k]+'" alt=""><input type="checkbox" value="'+k+'"> '+n+'</label>').join('');
function openAdmin(){stopHold();const s=S();
  $('fPct').value=s.pct;$('fDisc').value=s.disc;$('fTricks').value=s.tricks.join('\n');$('fSound').checked=s.sound;
  $('fChars').querySelectorAll('input').forEach(i=>i.checked=s.chars.includes(i.value));
  const t=data.stats[today()]||{};$('sTreat').textContent=t.treat||0;$('sTrick').textContent=t.trick||0;$('sKid').textContent=t.kid||0;
  const a={treat:0,trick:0,kid:0};let days=0;for(const k in data.stats){days++;for(const x in a)a[x]+=data.stats[k][x]||0}
  $('sAll').textContent='전체 '+days+'일: 트릿 '+a.treat+'번, 트릭 '+a.trick+'번, 코스튬 보너스 '+a.kid+'번';
  const r=$('resetToday');r.textContent='오늘 기록 지우기';r.dataset.arm='';admin.classList.add('show')}
$('save').addEventListener('click',()=>{const s0=S();
  const n=(v,d)=>{v=parseInt(v,10);return isNaN(v)?d:Math.min(50,Math.max(0,v))};
  const tr=$('fTricks').value.split('\n').map(x=>x.trim()).filter(Boolean);
  data.settings={pct:(v=>isNaN(v)?DEF.pct:Math.min(100,Math.max(0,v)))(parseInt($('fPct').value,10)),disc:n($('fDisc').value,DEF.disc),kid:s0.kid,sound:$('fSound').checked,
    chars:[...$('fChars').querySelectorAll('input:checked')].map(i=>i.value),tricks:tr.length?tr:[...DEF.tricks]};
  save();admin.classList.remove('show');setFoot();if(state==='idle'||state==='pick')build()});
$('cancel').addEventListener('click',()=>admin.classList.remove('show'));
$('resetToday').addEventListener('click',e=>{const b=e.currentTarget;if(!b.dataset.arm){b.dataset.arm='1';b.textContent='한 번 더 누르면 지워져요';return}
  delete data.stats[today()];save();openAdmin()});

setFoot();build();audio();
})();
</script>
</body>
</html>
